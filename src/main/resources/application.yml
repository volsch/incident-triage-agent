spring:
  application:
    name: incident-triage-agent

  ai:
    # Default model provider: local, open-source Qwen3 via Ollama (offline-friendly, no API key).
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen3:14b}
        # Chain-of-thought "thinking" mode. Left unset by default so the flag is not sent
        # at all and each model keeps its own default (Qwen3/DeepSeek-R1 think, others
        # don't). Set OLLAMA_THINK=false for direct answers without reasoning tokens -
        # much faster, at the cost of accuracy on harder cases. Do not set it to true for
        # a model without thinking support: Ollama rejects the request outright with
        # '"<model>" does not support thinking'.
        think: ${OLLAMA_THINK:}
        options:
          temperature: 0.2
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    # Fail fast when the model backend is down instead of hanging through the default
    # 10 retries with exponential backoff (which can stall a request for minutes).
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        max-interval: 3s
    openai:
      # Not used unless the "openai" profile is active; api-key must be supplied via env var.
      api-key: ${OPENAI_API_KEY:}

logging:
  level:
    org.springframework.ai: INFO

---
# Optional profile: swap the default Ollama/Qwen3 model for an OpenAI-compatible one,
# demonstrating Spring AI's model-agnostic ChatClient abstraction. Activate with:
#   --spring.profiles.active=openai
spring:
  config:
    activate:
      on-profile: openai
  ai:
    openai:
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
