name: "Dependabot auto-merge"

# Turns on GitHub's native auto-merge for Dependabot pull requests, so an update that
# passes the required status checks (the "Build & Test" workflow, dependency-review, etc.)
# is merged without manual intervention. Auto-merge only completes once every *required*
# check has passed, so this depends on branch protection for `main` marking those checks as
# required — otherwise `--auto` has nothing to wait on and the PR would merge immediately.
# It runs only for the trusted `dependabot[bot]` actor and requests the pull-requests write
# scope needed to enable auto-merge; Dependabot-triggered runs get a read-only token by
# default, so these elevated permissions apply solely to this workflow's own PRs.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    name: Enable auto-merge for Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
