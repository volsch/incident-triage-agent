name: "Build & Test"

# Runs the full quality gate (build, unit/slice tests, formatting, static analysis, code
# coverage) on every push and pull request, plus the Docker-based Testcontainers integration
# test, which GitHub-hosted Ubuntu runners can run out of the box since Docker is
# preinstalled. Dependency license policy is enforced separately by the "dependency-review"
# job (GitHub's official actions/dependency-review-action), which only runs on pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, unit tests & quality gate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, run fast tests, and enforce quality gates (Spotless + SpotBugs + JaCoCo)
        run: ./mvnw -B verify

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  integration-test:
    name: Docker/Testcontainers integration test (real Ollama)
    runs-on: ubuntu-latest
    needs: build-and-test
    # GitHub-hosted Ubuntu runners come with Docker preinstalled, which is all Testcontainers
    # needs — no additional service containers or Docker-in-Docker setup required.
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify Docker is available
        run: docker info

      - name: Run Testcontainers integration test (pulls qwen2.5:1.5b + nomic-embed-text)
        run: ./mvnw -B test -Pintegration-test

  license-report:
    name: Dependency license report (informational)
    runs-on: ubuntu-latest
    # Generates a human-readable report of every dependency's license for documentation/audit
    # purposes only; it does not fail the build. Policy enforcement (failing on incompatible
    # licenses) is handled by the "dependency-review" job below instead.

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Generate dependency license report
        run: ./mvnw -B license:aggregate-third-party-report

      - name: Upload dependency license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-license-report
          path: target/reports/aggregate-third-party-report.html
          if-no-files-found: ignore

  dependency-review:
    name: Dependency license & vulnerability review
    runs-on: ubuntu-latest
    # actions/dependency-review-action diffs dependencies between the PR base and head using
    # GitHub's dependency graph, so it only makes sense (and only runs) on pull requests.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency review (license + vulnerability policy gate)
        uses: actions/dependency-review-action@v5
        with:
          # Fail the PR if a *newly introduced* dependency isn't one of these SPDX licenses.
          # Covers every license family already present in this project's ~176 dependencies
          # (see the license-report job's artifact for the full audit). If a legitimately
          # compatible dependency is flagged (e.g. an unusual "GPL ... WITH Classpath-exception"
          # SPDX expression), add it to allow-dependencies-licenses instead of widening this list.
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, 0BSD,
            EPL-1.0, EPL-2.0, CDDL-1.0, CDDL-1.1, CC0-1.0,
            LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later,
            EDL-1.0, ISC, Unlicense
